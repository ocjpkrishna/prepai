<section class="page">
  <h1>Log in</h1>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email">
      @if (form.controls.email.hasError('email')) {
        <mat-error>Enter a valid email address</mat-error>
      }
    </mat-form-field>
    <mat-form-field>
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password">
    </mat-form-field>
    @if (invalidCredentials()) {
      <p class="form-error" role="alert">Email or password is incorrect.</p>
    }
    <app-api-error [error]="error()" (retry)="submit()" />
    <button matButton="filled" type="submit" class="full-width" [disabled]="submitting()">Log in</button>
  </form>
  <button matButton class="full-width" type="button" disabled
    title="Google sign-in is not configured yet">Continue with Google (coming soon)</button>
  <p class="muted">New to PrepAI? <a routerLink="/register">Create a free account</a></p>
</section>
