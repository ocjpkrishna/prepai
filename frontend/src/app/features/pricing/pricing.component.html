<section class="page">
  <h1>Plans</h1>
  <p class="muted">Start free with 3 sessions a day. Upgrade when you need more.</p>

  @if (error(); as current) {
    <app-api-error [error]="current" />
  }
  @if (paymentMessage(); as message) {
    <p class="notice" role="status">{{ message }}</p>
  }

  @if (plans().length === 0 && !error()) {
    <div class="skeleton" aria-hidden="true"></div>
  }
  <app-plan-cards [plans]="plans()" (choose)="choose($event)" />
  <p class="muted fine-print">Prices in Indian rupees. Payments are processed by Razorpay.</p>
</section>
