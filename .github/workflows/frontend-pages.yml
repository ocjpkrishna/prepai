name: Frontend demo (GitHub Pages)

on:
  push:
    branches: ['main', 'claude/**', 'row-*']
    paths: ['frontend/**', '.github/workflows/frontend-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build for the repository path
        run: npx ng build --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Publish to the gh-pages branch
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          rm -rf "$site" && mkdir -p "$site"
          cp -r dist/frontend/browser/. "$site/"
          touch "$site/.nojekyll"
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
